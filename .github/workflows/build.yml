name: Build RP2040 HID UF2

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          cmake \
          gcc-arm-none-eabi \
          libnewlib-arm-none-eabi \
          build-essential \
          git \
          python3

    - name: Clone pico-sdk
      run: |
        git clone https://github.com/raspberrypi/pico-sdk.git --depth=1
        cd pico-sdk
        git submodule update --init --recursive

    - name: Configure
      run: |
        mkdir -p build
        cd build
        cmake .. -DPICO_SDK_PATH=../pico-sdk

    - name: Build modified dev_hid_composite
      run: |
        cd build
        make dev_hid_composite -j4

    - name: Find UF2
      run: |
        find build -name "*.uf2" -print

    - name: Upload UF2
      uses: actions/upload-artifact@v4
      with:
        name: dev_hid_composite-uf2
        path: build/usb/device/dev_hid_composite/*.uf2
