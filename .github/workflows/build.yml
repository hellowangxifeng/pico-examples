name: Build RP2040 HID UF2

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          cmake \
          gcc-arm-none-eabi \
          libnewlib-arm-none-eabi \
          build-essential

    - name: Clone pico-sdk
      run: |
        git clone https://github.com/raspberrypi/pico-sdk.git --depth=1
        cd pico-sdk
        git submodule update --init

    - name: Configure
      run: |
        mkdir build
        cd build
        cmake .. \
          -DPICO_SDK_PATH=../pico-sdk

    - name: Build HID Composite
      run: |
        cd build
        make tinyusb_dev_hid_composite -j4

    - name: Find UF2
      run: |
        find build -name "*.uf2"

    - name: Upload UF2
      uses: actions/upload-artifact@v4
      with:
        name: pico-uf2
        path: build/**/*.uf2
